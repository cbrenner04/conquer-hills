# XcodeGen definition of the Xcode project. ConquerHills.xcodeproj is generated from this file
# (`make generate`) and is not committed; edit this file instead of the project in Xcode.

name: ConquerHills

options:
  bundleIdPrefix: com.hills-app
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  ConquerHillsKit:
    path: Packages/ConquerHillsKit

targets:
  ConquerHills:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - path: App/Resources
        excludes:
          - Courses
      # Bundled as a folder so course files land at Bundle.main/Courses/.
      - path: App/Resources/Courses
        type: folder
        buildPhase: resources
    dependencies:
      - package: ConquerHillsKit
        product: CourseKit
      - package: ConquerHillsKit
        product: WorkoutKit
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hills-app.conquerhills
        PRODUCT_NAME: ConquerHills
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Conquer Hills
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - package: ConquerHillsKit/CourseKitTests
        - package: ConquerHillsKit/WorkoutKitTests
        - ConquerHillsUITests

  # UI walkthrough with screenshots; run locally with `make ui-test` (not part of `make check`).
  ConquerHillsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppUITests
    dependencies:
      - target: ConquerHills
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hills-app.conquerhills.uitests
        TEST_TARGET_NAME: ConquerHills
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
